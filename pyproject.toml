[project]
name = "music-sae-YuE"
version = "0.0.1"
description = ""
requires-python = ">=3.9,<=3.10"
readme = "README.md"
dependencies = [
    "accelerate>=1.6.0",
    "descript-audio-codec>=1.0.0",
    "descript-audiotools>=0.7.2",
    "einops>=0.8.1",
    "numpy>=2.0.2",
    "omegaconf>=2.3.0",
    "scipy>=1.13.1",
    "sentencepiece>=0.2.0",
    "tensorboard>=2.19.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "transformers>=4.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.2",
    "pre-commit>=4.2.0"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118" },
]
torchaudio = [
    { index = "pytorch-cu118" },
]
torchvision = [
    { index = "pytorch-cu118" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
